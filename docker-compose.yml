name: myrecipes

services:
  app:
    build: .
    image: myrecipes:latest
    container_name: myrecipes
    restart: unless-stopped
    ports:
      - "1331:1331"
    volumes:
      - ./data:/data            # SQLite (если выбран), конфиг, секретный ключ, в будущем — фото
    extra_hosts:
      # Адрес самого NAS изнутри контейнера — для MariaDB, установленной на сервере
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Asia/Novosibirsk
      # Защита мастера первого запуска: пока админ не создан, страница настройки
      # доступна всем, кто знает адрес. Задайте токен — мастер его спросит.
      # SETUP_TOKEN: "придумайте-длинную-строку"

      # Если указать, шаг выбора БД в мастере пропускается.
      # MariaDB на Synology (пакет MariaDB 10) по умолчанию слушает порт 3307:
      # DATABASE_URL: "mysql+pymysql://recipes:ПАРОЛЬ@host.docker.internal:3307/recipes?charset=utf8mb4"

      # Секрет для JWT. Если не задан — генерируется и хранится в /data/secret.key
      # SECRET_KEY: ""
